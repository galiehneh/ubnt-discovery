[workspace]
members = [".", "android/rust"]

[package]
name = "ubnt-discovery"
version = "2026.10.18"
edition = "2021"
description = "Portable LAN discovery tool for Ubiquiti devices"
authors = ["galiehneh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/galiehneh/ubnt-discovery"
build = "build.rs"

[lib]
name = "ubnt_discovery"
path = "src/lib.rs"

[[bin]]
name = "UbntDiscovery"
path = "src/main.rs"

[dependencies]
socket2 = "0.5"
if-addrs = "0.13"
opener = "0.7"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", features = ["list-view", "notice", "animation-timer", "clipboard", "high-dpi", "image-decoder"] }
winapi = { version = "0.3", features = ["commctrl", "dwmapi", "uxtheme", "wingdi", "winreg", "winuser"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
