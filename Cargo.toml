[package]
name = "ubnt-discovery"
version = "1.0.0"
edition = "2021"
description = "Portable LAN discovery tool for Ubiquiti devices"
build = "build.rs"

[lib]
name = "ubnt_discovery"
path = "src/lib.rs"

[[bin]]
name = "UbntDiscovery"
path = "src/main.rs"

[dependencies]
native-windows-gui = { version = "1.0.13", features = ["list-view", "status-bar", "notice", "animation-timer", "clipboard", "high-dpi"] }
socket2 = "0.5"
if-addrs = "0.13"
opener = "0.7"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
